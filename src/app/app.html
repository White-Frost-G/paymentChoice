<div class="container" >
  <div
    class="item"
    *ngFor="let item of items"
    (click)="selectItem(item)"
    [class.selected]="item === selectedItem"
  >
  <div class="dot" [class.filled]="item === selectedItem"></div>
    <img [src]="item.image" />
    <div class="content">
      <p>{{ item.name }}</p>
    </div>
  </div>
</div>
